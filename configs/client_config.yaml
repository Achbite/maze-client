# Maze Client 只配置环境执行实例与通信入口。
# Agent 数、地图、Episode 时限和 workload 都由 AIServer OpenSession 分配。
# Client 不形成第二权威入口。

run:
  client_instance_id: "maze-client-0"       # Client 进程实例身份；同一生命周期内稳定
  environment_instance_id: "maze-env-0"     # 环境实例身份；不可代替 Session ID
  log_interval: 10                           # 帧日志间隔，单位 frame

env:
  map_registry_dir: "../maps/test"           # 相对所选 config 文件解析

network:
  server_host: "maze-aiserver"               # AIServer Maze Task gRPC 地址
  server_port: 9002                           # AIServer Maze Task gRPC 端口

viz:
  output_dir: "../log/viz"                   # Replay 帧记录目录，相对所选 config
  interval: 1                                 # Replay 记录间隔，单位 frame
  server_port: 9004                           # 本地 Replay HTTP 端口

# 未来 Infra 可通过白名单环境变量断言本 Pod 的 assignment；null 表示不断言。
# 这些字段不决定真实任务，真实值始终来自 AIServer OpenSession。
expected:
  map_id: null
  map_sha256: null
